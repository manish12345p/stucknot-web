<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About | StuckNot</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../stucknot-design-system.css">
  <style>
    /* Inline styles for navigation alignment */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .json-loading { opacity: 0; transition: opacity 0.3s ease; }
    .json-loaded { opacity: 1; }
    
    @media (min-width: 900px) {
      .header-nav-wrapper {
        position: static !important;
        flex-direction: row !important;
        width: 100% !important;
        height: auto !important;
        padding: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: nowrap;
        gap: 16px;
      }
      .nav-links {
        flex-wrap: nowrap;
        gap: 16px;
        align-items: center;
      }
      .nav-links a {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header" role="banner">
    <div class="container">
      <a href="../../index.html" aria-label="StuckNot Home"><span class="logo-img" role="img" aria-label="StuckNot logo"></span></a>
      <button class="mobile-menu-btn" aria-label="Toggle navigation" aria-expanded="false">
        <span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span>
      </button>
      <div class="header-nav-wrapper" id="mobile-nav">
        <nav class="nav-links" aria-label="Main navigation" id="nav-main-links">
          <a href="../../index.html">Home</a>
          <!-- Populated by JSON -->
        </nav>
      </div>
    </div>
  </header>

  <main id="main-content" class="json-loading">
    <section style="min-height: 60vh; padding: 160px 0 80px; position: relative; overflow: visible; display: flex; flex-direction: column; justify-content: center; align-items: center;">
      <!-- Ambient Glow (Inherits body background, just adds a subtle highlight) -->
      <div style="position: absolute; top: 0; left: 50%; width: 100%; height: 500px; background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.05) 0%, transparent 70%); transform: translateX(-50%); pointer-events: none; z-index: 0;"></div>
      
      <div class="container" style="position: relative; z-index: 2; text-align: center; perspective: 1000px;">
        
        <!-- Glassmorphic Card -->
        <div class="hero-glass-card bento-card bento-flywheel reveal reveal-stagger-1" style="display: inline-block; padding: 60px 80px; background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 32px; box-shadow: 0 40px 80px rgba(0,0,0,0.3); max-width: 900px; margin: 0 auto; transform-style: preserve-3d; transition: transform 0.5s var(--ease-out);">
          
          <div class="flywheel" style="transform-style: preserve-3d; transition: transform 0.5s var(--ease-out);">
            <p class="section-eyebrow" style="color: var(--rose); margin-bottom: 24px; display: inline-flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: 1px; transform: translateZ(30px);">
              <span style="display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 12px var(--rose);"></span>
              About Us
            </p>
            
            <h1 class="hero-heading-text" id="hero-heading" style="font-size: 68px; line-height: 1.1; margin-bottom: 24px; color: #fff; font-weight: 700; letter-spacing: -2px; transform: translateZ(50px); text-shadow: 0 20px 40px rgba(0,0,0,0.4);"></h1>
            
            <p class="hero-subheading-text" id="hero-subheading" style="font-size: 20px; max-width: 600px; color: rgba(255,255,255,0.7); line-height: 1.6; margin: 0 auto; transform: translateZ(20px);"></p>
          </div>
          
        </div>
      </div>
    </section>

    <!-- ===== THE ENGINE ===== -->
    <section style="padding: 100px 0; position: relative;">
      <div class="container">
        <div style="text-align: center; margin-bottom: 80px;" class="reveal">
          <h2 style="font-size: 40px; font-weight: 700; color: #fff; margin-bottom: 16px;">The Engine</h2>
          <p style="color: rgba(255,255,255,0.7); max-width: 600px; margin: 0 auto; font-size: 18px;">How we turn ambition into production code.</p>
        </div>
        
        <div id="engine-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; position: relative;" class="reveal reveal-stagger-2">
          <!-- Populated by JSON -->
        </div>
      </div>
    </section>

    <!-- ===== OUR VALUES ===== -->
    <section style="padding: 80px 0 120px; background: rgba(0,0,0,0.2);">
      <div class="container">
        <div style="text-align: center; margin-bottom: 80px;" class="reveal">
          <h2 style="font-size: 40px; font-weight: 700; color: #fff; margin-bottom: 16px;">Our Values</h2>
          <p style="color: rgba(255,255,255,0.7); max-width: 600px; margin: 0 auto; font-size: 18px;">The principles that govern our codebase and our community.</p>
        </div>
        
        <div id="values-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;" class="reveal reveal-stagger-3">
          <!-- Populated by JSON -->
        </div>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer" role="contentinfo" style="margin-top: 0;">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <div class="logo-img" style="margin-bottom: 24px;"></div>
          <p id="footer-desc"></p>
        </div>
        <div class="footer-links-wrapper" id="footer-inner">
          <!-- Populated by JSON -->
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; <span id="current-year"></span> StuckNot. A community of builders.</p>
        <div style="display:flex; gap:16px;">
          <a href="../../legal/privacy-policy.html">Privacy Policy</a>
          <a href="../../legal/terms-of-service.html">Terms of Service</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Link to the main JS file for global scripts -->
  <script src="../../main.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Set current year
      document.getElementById('current-year').textContent = new Date().getFullYear();

      try {
        const response = await fetch('../../data.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await (await response).json();

        // --- Populate Navigation ---
        const navMain = document.getElementById('nav-main-links');
        
        Object.keys(data.footer.links).forEach(section => {
          if (section !== 'Community') {
             navMain.innerHTML += `<a href="../../${section.toLowerCase()}/index.html">${section}</a>`;
          } else {
             navMain.innerHTML += `<a href="../../community/index.html" class="active">${section}</a>`;
          }
        });

        // --- Populate Hero ---
        if(data.community_about && data.community_about.hero) {
          document.getElementById('hero-heading').textContent = data.community_about.hero.headline;
          document.getElementById('hero-subheading').textContent = data.community_about.hero.description;
        }

        // --- Populate Engine ---
        const engineGrid = document.getElementById('engine-grid');
        if(data.community_about && data.community_about.engine) {
          data.community_about.engine.forEach(step => {
            engineGrid.innerHTML += `
              <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 40px; border-radius: 24px; position: relative;">
                <div style="font-size: 64px; font-weight: 900; color: rgba(255,255,255,0.05); position: absolute; top: 20px; right: 30px; line-height: 1;">${step.step}</div>
                <h3 style="font-size: 24px; color: #fff; margin-bottom: 16px; font-weight: 700; position: relative; z-index: 1;">${step.title}</h3>
                <p style="color: rgba(255,255,255,0.7); font-size: 16px; line-height: 1.6; position: relative; z-index: 1;">${step.desc}</p>
              </div>
            `;
          });
        }

        // --- Populate Values ---
        const valuesGrid = document.getElementById('values-grid');
        if(data.community_about && data.community_about.values) {
          data.community_about.values.forEach(val => {
             const svgIcon = window.ICONS && window.ICONS[val.icon] ? window.ICONS[val.icon] : '<circle cx="12" cy="12" r="10"/>';
             valuesGrid.innerHTML += `
               <div class="bento-card bento-image" style="background: rgba(255,255,255,0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); padding: 40px; border-radius: 24px; transition: all 0.3s ease;">
                 <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; color: var(--rose);">
                   <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">${svgIcon}</svg>
                 </div>
                 <h3 style="font-size: 20px; color: #fff; margin-bottom: 12px; font-weight: 600;">${val.title}</h3>
                 <p style="color: rgba(255,255,255,0.6); font-size: 15px; line-height: 1.6;">${val.text}</p>
               </div>
             `;
          });
        }

        // --- Populate Footer ---
        document.getElementById('footer-desc').textContent = data.footer.brandDescription;
        const footerInner = document.getElementById('footer-inner');
        Object.keys(data.footer.links).forEach(section => {
          let linksHtml = data.footer.links[section].map(link => `<a href="../../${link.url.replace(/^\//, '')}">${link.name}</a>`).join('');
          footerInner.innerHTML += `
            <div>
              <h3 class="footer-col-heading">${section}</h3>
              <div class="footer-links">
                ${linksHtml}
              </div>
            </div>
          `;
        });

        // Show content
        document.getElementById('main-content').classList.replace('json-loading', 'json-loaded');
        
        // Trigger existing animations
        if (typeof initScrollReveal === 'function') {
           setTimeout(() => { initScrollReveal(); }, 100);
        }

      } catch (error) {
        console.error('Failed to load JSON database:', error);
        document.getElementById('main-content').innerHTML = '<div class="container" style="padding:100px 0; text-align:center;"><h2>Error loading content. Please try again.</h2></div>';
        document.getElementById('main-content').classList.replace('json-loading', 'json-loaded');
      }
    });
  </script>
</body>
</html>
